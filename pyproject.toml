[project]
name = "trustlens"
version = "0.1.0"
description = "Explainable multi-signal review integrity platform"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # Black governs wrapping; long docstrings/messages are acceptable
