apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustlens
  namespace: trustlens
spec:
  ingressClassName: nginx
  rules:
    - host: trustlens.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: trustlens-api, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: trustlens-streamlit, port: {number: 8501}}
