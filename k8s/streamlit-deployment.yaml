apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustlens-streamlit
  namespace: trustlens
spec:
  replicas: 2
  selector:
    matchLabels: {app: trustlens-streamlit}
  template:
    metadata:
      labels: {app: trustlens-streamlit}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: streamlit
          image: trustlens:latest
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "streamlit_app/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: {name: trustlens-config}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - {name: model, mountPath: /app/artifacts, readOnly: true}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: trustlens-model-pvc, readOnly: true}
