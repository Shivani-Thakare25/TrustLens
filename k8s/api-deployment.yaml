apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustlens-api
  namespace: trustlens
spec:
  replicas: 2
  selector:
    matchLabels: {app: trustlens-api}
  template:
    metadata:
      labels: {app: trustlens-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: trustlens:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.fastapi_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: trustlens-config}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - {name: model, mountPath: /app/artifacts, readOnly: true}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: trustlens-model-pvc, readOnly: true}
